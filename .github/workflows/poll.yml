name: Poll News + Scores

on:
  # cron-job.org triggert via workflow_dispatch (GitHub API).
  # Falls cron-job.org mal ausfällt, kannst du die schedule-Zeile unten auskommentieren als Fallback.
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *'

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: node src/cli.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GOAL_PING_MENTION: ${{ secrets.GOAL_PING_MENTION }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
